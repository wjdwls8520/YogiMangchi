version: "3.8"

services:
  # 1. PostgreSQL 데이터베이스
  db:
    image: ankane/pgvector
    container_name: yogimangchi-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. Redis 캐시
  redis:
    image: redis:alpine
    container_name: yogimangchi-redis
    ports:
      - "6379:6379"

  # 3. Spring Boot (WAS) - 새로 추가됨
  was:
    # 아래 주소는 ECR에 푸시한 내 이미지 주소로 변경해야 합니다.
    image: 543953893461.dkr.ecr.ap-northeast-2.amazonaws.com/yogimangchi_sever:latest
    container_name: yogimangchi-was
    environment:
      # 도메인 주소
      - DOMAIN_ADDRESS=${DOMAIN_ADDRESS_VALUE}
      # DB와 Redis를 같은 컴포즈 네트워크 이름(db, redis)으로 찾습니다.
      - DB_HOST=db
      - REDIS_HOST=redis
      # OAuth2
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      # S3
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS=${S3_ACCESS}
      - S3_SECRET=${S3_SECRET}
      - S3_REGION=${S3_REGION}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      # GMAIL
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"

  # 4. Next.js (Web) - 새로 추가됨
  web:
    # 아래 주소는 ECR에 푸시한 내 이미지 주소로 변경해야 합니다.
    image: 543953893461.dkr.ecr.ap-northeast-2.amazonaws.com/yogimangchi_client:latest
    container_name: yogimangchi-web
    depends_on:
      - was
    ports:
      - "3000:3000"

  # 5. Nginx (웹 서버/리버스 프록시) - 새로 추가됨
  nginx:
    image: nginx:alpine
    container_name: yogimangchi-nginx
    ports:
      - "80:80"
    volumes:
      # 우리가 작성할 nginx.conf 파일을 컨테이너 내부에 덮어씌웁니다.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - was