version: "3.8"

services:
  # 1. PostgreSQL 데이터베이스
  db:
    image: ankane/pgvector
    container_name: yogimangchi-db
    # 💡 environment 블록을 하나로 합치고 콤마/대시 포맷을 통일했습니다.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    # 💡 볼륨 리스트를 하나로 이쁘게 묶었습니다.
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5432:5432"

  # 2. Redis 캐시
  redis:
    image: redis:alpine
    container_name: yogimangchi-redis
    ports:
      - "6379:6379"

  # 3. Spring Boot (WAS)
  was:
    image: 543953893461.dkr.ecr.ap-northeast-2.amazonaws.com/yogimangchi_sever:latest
    container_name: yogimangchi-was
    # 💡 흩어져 있던 백엔드 환경 변수들과 타임존 지정을 한곳으로 완벽히 병합했습니다!
    environment:
      - DOMAIN_ADDRESS=${DOMAIN_ADDRESS_VALUE}
      - DB_HOST=db
      - REDIS_HOST=redis
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS=${S3_ACCESS}
      - S3_SECRET=${S3_SECRET}
      - S3_REGION=${S3_REGION}
      - JWT_SECRET=${JWT_SECRET}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - TZ=Asia/Seoul
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"

  # 4. Next.js (Web) - 프론트 이미지 주소 완전 무결 상태 확인 완료 👍
  web:
    image: 543953893461.dkr.ecr.ap-northeast-2.amazonaws.com/yogimangchi_client:latest
    container_name: yogimangchi-web
    depends_on:
      - was
    ports:
      - "3000:3000"

  # 5. Nginx (웹 서버/리버스 프록시)
  nginx:
    image: nginx:alpine
    container_name: yogimangchi-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - was