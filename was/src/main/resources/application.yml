    - XRPUSDT # 리플
    # --- [메이저 알트코인] ---
    - ADAUSDT # 에이다 (카르다노)
    - AVAXUSDT # 아발란체
    - DOTUSDT # 폴카닷
    - LINKUSDT # 체인링크
    - POLUSDT # 폴리곤
    - TRXUSDT # 트론
    - LTCUSDT # 라이트코인
    - BCHUSDT # 비트코인 캐시
    - ETCUSDT # 이더리움 클래식
    - ATOMUSDT # 코스모스
    # --- [밈(Meme) 코인] ---
