server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: yogimangchi

  #서버실행시 코인data.sql실행
  sql:
    init:
      mode: always

  #파일용량제한
  servlet:
    multipart:
      max-file-size: 5MB
      # multipart 경계/헤더 오버헤드를 고려해 요청 한도는 실제 파일 총합(50MB)보다 조금 크게 둡니다.
      max-request-size: 55MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # 배포에선 validate / 개발은 update
    #서버실행시 코인data.sql실행
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 30        # 기본 10 → 30
      minimum-idle: 10
      connection-timeout: 10000      # 10초 (기본 30초)
      leak-detection-threshold: 30000  # 30초 이상 점유 시 경고 로그

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET}
      credentials:
        access-key: ${S3_ACCESS}
        secret-key: ${S3_SECRET}
      region:
        static: ${S3_REGION}
        auto: false
      stack:
        auto: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              #              - openid
              - profile
              - email

          kakao:
            provider: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}   # 본인 Gmail 주소
    password: ${GMAIL_APP_PASSWORD}  # 앱 비밀번호 16자리
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-ms: 3600000
  refresh-token-expire-ms: 1209600000

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

binance:
  # 바이낸스 공개 웹소켓 주소
  # 지금은 로그인이나 API Key 없이 "공개 시세"만 받아옵니다.
