server:
  port: 8080

spring:
  application:
    name: yogimangchi

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET}
      credentials:
        access-key: ${S3_ACCESS}
        secret-key: ${S3_SECRET}
      region:
        static: ${S3_REGION}
        auto: false
      stack:
        auto: false

binance:
  websocket-url: wss://stream.binance.com:9443
  tracked-symbols:
    - BTCUSDT
    - ETHUSDT
    - XRPUSDT
