server:
  port: 8080

spring:
  application:
    name: yogimangchi

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    aws:
      s3:
        bucket: ${S3_BUCKET}
      credentials:
        access-key: ${S3_ACCESS}
        secret-key: ${S3_SECRET}
      region:
        static: ${S3_REGION}
        auto: false
      stack:
        auto: false

binance:
  # 바이낸스 공개 웹소켓 주소
  # 지금은 로그인이나 API Key 없이 "공개 시세"만 받아옵니다.
  websocket-url: wss://stream.binance.com:9443
  tracked-symbols:
    # symbol(심볼) = 거래 종목 이름
    - BTCUSDT
    - ETHUSDT
    - XRPUSDT
